# backend-vm — the 10 services this demo covers: API Gateway, Auth,
# Tenant, Employee, Agent Registry, LLM Gateway, Memory, Knowledge,
# OpenClaw Runtime, Analytics — plus Caddy in front for automatic TLS.
#
# Deliberately NOT included: Skill Marketplace and Audit Service. Skill
# Marketplace needs per-connector OAuth app registrations to be useful at
# all (nothing to demo without them); Audit Service and Analytics'
# RabbitMQ-fed ingestion both need a message broker this two-VM layout
# doesn't provision (db-vm is Postgres + Redis only, per the ask). This
# isn't a silent gap: every service's event PUBLISHER already connects
# lazily and swallows failures (see libs/events/src/events/publisher.py's
# RabbitMQPublisher and publish.py's schedule_publish), and Analytics'
# event CONSUMER retries forever with backoff without blocking its own
# startup (see services/analytics-service/src/analytics_service/consumer.py's
# _run_forever) — so nothing here crashes for lack of a broker, ingestion
# and audit logging just don't receive anything. Analytics' own read API
# (usage/cost queries against its own DB) still works normally.
#
# Images come from the same Artifact Registry the GKE deployment path
# pushes to (see ../terraform/gcp/artifact_registry.tf and
# ../../.github/workflows/deploy-gcp.yml) — AR_HOST/GCP_PROJECT_ID/IMAGE_TAG
# are read from .env, not hardcoded, so this isn't tied to one project.
#
# Every DB-backed service waits for db-vm's Postgres to be reachable
# before starting (scripts/wait-for.sh, bind-mounted in) rather than
# assuming it's already up — db-vm is a real network hop now, not a
# container-network hostname Docker itself sequences. Each also has its
# own one-shot migration container ahead of it
# (`condition: service_completed_successfully`), since nothing bakes
# `alembic upgrade head` into the image's own CMD (see each Dockerfile's
# tail — it's a bare `uvicorn ...`, deliberately, so a transient DB
# outage never turns into a crash-looping container: the app process
# itself starts fine regardless, only actual DB-touching requests fail
# until the database answers).
#
# `restart: unless-stopped` everywhere — the actual reboot-survival
# mechanism is the systemd unit (../systemd/staffstream-backend.service)
# invoking `docker compose up -d` on boot, but this covers a container
# that dies mid-session without a full VM reboot.
services:
  # --- One-shot migrations, one per DB-backed service -----------------
  migrate-tenant-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/tenant-service:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      TENANT_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/tenant_service
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["sh", "-c", "cd services/tenant-service && alembic upgrade head"]

  migrate-employee-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/employee-service:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      EMPLOYEE_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/employee_service
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["sh", "-c", "cd services/employee-service && alembic upgrade head"]

  migrate-auth-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/auth-service:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      AUTH_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/auth_service
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["sh", "-c", "cd services/auth-service && alembic upgrade head"]

  migrate-agent-registry:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/agent-registry:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      AGENT_REGISTRY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/agent_registry
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["sh", "-c", "cd services/agent-registry && alembic upgrade head"]

  migrate-memory-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/memory-service:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      MEMORY_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/memory_service
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["sh", "-c", "cd services/memory-service && alembic upgrade head"]

  migrate-knowledge-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/knowledge-service:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      KNOWLEDGE_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/knowledge_service
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["sh", "-c", "cd services/knowledge-service && alembic upgrade head"]

  migrate-analytics-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/analytics-service:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      ANALYTICS_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/analytics_service
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["sh", "-c", "cd services/analytics-service && alembic upgrade head"]

  # --- App services -----------------------------------------------------
  tenant-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/tenant-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate-tenant-service:
        condition: service_completed_successfully
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      TENANT_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/tenant_service
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["uvicorn", "tenant_service.main:app", "--host", "0.0.0.0", "--port", "8001", "--app-dir", "services/tenant-service/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  employee-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/employee-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate-employee-service:
        condition: service_completed_successfully
      agent-registry:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      EMPLOYEE_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/employee_service
      EMPLOYEE_SERVICE_AGENT_REGISTRY_URL: http://agent-registry:8004
      EMPLOYEE_SERVICE_TENANT_SERVICE_URL: http://tenant-service:8001
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["uvicorn", "employee_service.main:app", "--host", "0.0.0.0", "--port", "8002", "--app-dir", "services/employee-service/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate-auth-service:
        condition: service_completed_successfully
      employee-service:
        condition: service_healthy
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      AUTH_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/auth_service
      AUTH_SERVICE_EMPLOYEE_SERVICE_URL: http://employee-service:8002
      # Only matters if you actually configure SSO for a tenant (out of
      # scope for this demo) — must match {DEMO_DOMAIN}/auth exactly if
      # you do, since api-gateway proxies the "auth" path prefix here.
      AUTH_SERVICE_PUBLIC_BASE_URL: https://${DEMO_DOMAIN}/auth
      SSO_ENCRYPTION_KEY: ${SSO_ENCRYPTION_KEY:-gglttmY9baFzyNjGySfCNv-Xg_r-vaxIePrRyNv-s9Q=}
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["uvicorn", "auth_service.main:app", "--host", "0.0.0.0", "--port", "8003", "--app-dir", "services/auth-service/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-registry:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/agent-registry:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate-agent-registry:
        condition: service_completed_successfully
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      AGENT_REGISTRY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/agent_registry
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["uvicorn", "agent_registry.main:app", "--host", "0.0.0.0", "--port", "8004", "--app-dir", "services/agent-registry/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  llm-gateway:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/llm-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No DB, no Redis — nothing to wait for. Provider API keys are only
    # needed to actually call that provider; missing ones just fail with
    # a normal auth error from the provider on first use (see
    # .env.example's comment), same as every other deployment path.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-set}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-not-set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-not-set}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-not-set}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-claude}
    command: ["uvicorn", "llm_gateway.main:app", "--host", "0.0.0.0", "--port", "8005", "--app-dir", "services/llm-gateway/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  memory-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/memory-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate-memory-service:
        condition: service_completed_successfully
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      MEMORY_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/memory_service
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["uvicorn", "memory_service.main:app", "--host", "0.0.0.0", "--port", "8007", "--app-dir", "services/memory-service/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  knowledge-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/knowledge-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate-knowledge-service:
        condition: service_completed_successfully
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      KNOWLEDGE_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/knowledge_service
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-not-set}
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["uvicorn", "knowledge_service.main:app", "--host", "0.0.0.0", "--port", "8008", "--app-dir", "services/knowledge-service/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  openclaw-runtime:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/openclaw-runtime:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No DB of its own (stateless, per CLAUDE.md) — depends on its sibling
    # HTTP services being up instead of a wait-for-tcp check.
    depends_on:
      agent-registry:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      memory-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      OPENCLAW_RUNTIME_AGENT_REGISTRY_URL: http://agent-registry:8004
      OPENCLAW_RUNTIME_LLM_GATEWAY_URL: http://llm-gateway:8005
      OPENCLAW_RUNTIME_MEMORY_SERVICE_URL: http://memory-service:8007
      OPENCLAW_RUNTIME_EMPLOYEE_SERVICE_URL: http://employee-service:8002
      OPENCLAW_RUNTIME_KNOWLEDGE_SERVICE_URL: http://knowledge-service:8008
      # Skill Marketplace isn't deployed in this demo (see this file's top
      # comment) — left at its own default (unreachable). Harmless: an
      # agent's tool-loading step only calls out to it when the agent has
      # a non-empty `skills` allowlist (services/openclaw-runtime/src/openclaw_runtime/skills.py's
      # load_tools), and no agent gets one without Skill Marketplace
      # existing to enable a skill on in the first place.
    command: ["uvicorn", "openclaw_runtime.main:app", "--host", "0.0.0.0", "--port", "8006", "--app-dir", "services/openclaw-runtime/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics-service:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/analytics-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate-analytics-service:
        condition: service_completed_successfully
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      ANALYTICS_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staffstream}:${POSTGRES_PASSWORD}@${DB_VM_INTERNAL_IP}:5432/analytics_service
      # RABBITMQ_URL deliberately left unset (defaults to
      # amqp://guest:guest@localhost:5672/, which nothing is listening
      # on) — see this file's top comment. The consumer retries forever
      # in the background without blocking startup or crash-looping.
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:5432", "--"]
    command: ["uvicorn", "analytics_service.main:app", "--host", "0.0.0.0", "--port", "8009", "--app-dir", "services/analytics-service/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    image: ${AR_HOST:-asia-south1-docker.pkg.dev}/${GCP_PROJECT_ID}/staffstream/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      tenant-service: {condition: service_healthy}
      employee-service: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      agent-registry: {condition: service_healthy}
      llm-gateway: {condition: service_healthy}
      openclaw-runtime: {condition: service_healthy}
      memory-service: {condition: service_healthy}
      knowledge-service: {condition: service_healthy}
      analytics-service: {condition: service_healthy}
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      REDIS_URL: redis://${DB_VM_INTERNAL_IP}:6379/0
      API_GATEWAY_TENANT_SERVICE_URL: http://tenant-service:8001
      API_GATEWAY_EMPLOYEE_SERVICE_URL: http://employee-service:8002
      API_GATEWAY_AUTH_SERVICE_URL: http://auth-service:8003
      API_GATEWAY_AGENT_REGISTRY_URL: http://agent-registry:8004
      API_GATEWAY_LLM_GATEWAY_URL: http://llm-gateway:8005
      API_GATEWAY_OPENCLAW_RUNTIME_URL: http://openclaw-runtime:8006
      API_GATEWAY_MEMORY_SERVICE_URL: http://memory-service:8007
      API_GATEWAY_KNOWLEDGE_SERVICE_URL: http://knowledge-service:8008
      # No API_GATEWAY_SKILL_MARKETPLACE_URL — Skill Marketplace isn't
      # deployed in this demo (see this file's top comment); left at its
      # own default. A request to /skills, /connections, or /tools fails
      # with a normal proxy error instead of routing anywhere real.
    volumes:
      - ./scripts/wait-for.sh:/wait-for.sh:ro
    entrypoint: ["/bin/sh", "/wait-for.sh", "${DB_VM_INTERNAL_IP}:6379", "--"]
    command: ["uvicorn", "api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "services/api-gateway/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- Edge: TLS termination + reverse proxy -----------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?set your demo domain in .env — must already point an A record at this VM's static external IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
