# Backs everything except knowledge-service (see postgres-vector.yaml) —
# same split as docker-compose.yml, for the same reason: knowledge-service
# needs the pgvector extension and its own image/collation, so it gets its
# own instance rather than sharing this one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: staffstream
data:
  init-db.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    for db in tenant_service employee_service auth_service agent_registry memory_service analytics_service skill_marketplace audit_service; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        SELECT 'CREATE DATABASE $db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec
    EOSQL
    done
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: staffstream
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: staffstream
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate # a single ReadWriteOnce volume can't do a rolling update
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Phase 10: default max_connections (100) was sized for phase
          # 6's single-replica-per-service baseline. This instance backs
          # 8 services (see the initdb loop above), each now pooling
          # pool_size=10/max_overflow=15 per pod (libs/tenancy's
          # make_engine) and each independently scaled by its own HPA
          # (infra/k8s/services/*.yaml) up to 3-6 replicas. Worst case if
          # every service's HPA maxed out at once is well north of 300,
          # but services don't all peak together in practice — 300 is
          # deliberately not the theoretical worst case, it's a budget
          # sized against realistic multi-tenant load (see
          # docs/phase10-load-test.md). A real production deployment
          # under sustained high tenant counts should sit PgBouncer in
          # front of this rather than raising max_connections further —
          # noted as a follow-up, not built this phase.
          args: ["-c", "max_connections=300"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: staffstream-secrets, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: staffstream-secrets, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              value: "staffstream"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # avoid postgres seeing the mount point's lost+found dir
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "staffstream"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "staffstream"]}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            # Bumped alongside max_connections above — each connection
            # carries its own backend-process memory overhead, so more
            # allowed connections needs more headroom than phase 6's
            # single-service-per-replica baseline assumed.
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "2", memory: "1Gi"}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: initdb
          configMap: {name: postgres-initdb}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: staffstream
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
