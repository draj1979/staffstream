apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: staffstream
  labels:
    app: memory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
    spec:
      containers:
        - name: memory-service
          image: staffstream/memory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8007
          envFrom:
            - configMapRef: {name: staffstream-config}
            - secretRef: {name: staffstream-secrets}
          livenessProbe:
            httpGet: {path: /healthz, port: 8007}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8007}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: memory-service
  namespace: staffstream
spec:
  selector:
    app: memory-service
  ports:
    - port: 8007
      targetPort: 8007
---
# New in Phase 10: none of these HPAs existed before this phase, despite
# k8s manifests going in at phase 6 — HPA needs the CPU requests every
# Deployment already sets (see above) to compute utilization, so it slots
# in cleanly now. minReplicas matches this Deployment's static `replicas:`
# above (once the HPA is applied, that field is only the starting point —
# the HPA controller owns replica count from here on).
# Read/write on every chat turn but lightweight (Postgres-only, no embeddings) relative to the LLM/runtime hops around it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memory-service
  namespace: staffstream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memory-service
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      # Don't thrash replicas down the moment load dips for a minute —
      # multi-tenant traffic is bursty (different tenants' business
      # hours), so a slow scale-down avoids flapping back up minutes later.
      stabilizationWindowSeconds: 300
