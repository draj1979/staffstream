apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-service
  namespace: staffstream
  labels:
    app: knowledge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-service
  template:
    metadata:
      labels:
        app: knowledge-service
    spec:
      containers:
        - name: knowledge-service
          image: staffstream/knowledge-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8008
          envFrom:
            - configMapRef: {name: staffstream-config}
            - secretRef: {name: staffstream-secrets}
          livenessProbe:
            httpGet: {path: /healthz, port: 8008}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8008}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-service
  namespace: staffstream
spec:
  selector:
    app: knowledge-service
  ports:
    - port: 8008
      targetPort: 8008
