apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: staffstream
  labels:
    app: employee-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
        - name: employee-service
          image: staffstream/employee-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef: {name: staffstream-config}
            - secretRef: {name: staffstream-secrets}
          livenessProbe:
            httpGet: {path: /healthz, port: 8002}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8002}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
  namespace: staffstream
spec:
  selector:
    app: employee-service
  ports:
    - port: 8002
      targetPort: 8002
