# One SecretProviderClass per service — this is the actual CSI-driver
# mechanism that replaces the shared staffstream-secrets Kubernetes Secret
# (see ../../secret.example.yaml) with per-service, least-privilege access.
# Each references exactly the secrets that service's own GSA is granted
# roles/secretmanager.secretAccessor on
# (../../../terraform/gcp/workload_identity.tf's accessor grants,
# generated from that same locals.tf map this file mirrors by hand — see
# this directory's README.md for how the two are kept in sync).
#
# The `secretObjects` block is what makes this additive rather than a
# rewrite of every service's env var handling: it syncs the mounted
# secrets into a real Kubernetes Secret (named "<service>-secrets", one
# key per env var, same names as today) that the Deployment's `envFrom`
# still just references by name (see deployment-patches.yaml) — the pod's
# own env var surface doesn't change at all, only where the values
# ultimately come from. The CSI volume mount itself
# (deployment-patches.yaml's `volumeMounts`) is what triggers this sync;
# nothing in the app reads files under /mnt/secrets-store directly.
#
# rational-medley-466807-b3 gets replaced once by set-gcp-project.sh — see this
# directory's README.md.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tenant-service-secrets
  namespace: staffstream
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/rational-medley-466807-b3/secrets/JWT_SECRET_KEY/versions/latest"
        fileName: "JWT_SECRET_KEY"
      - resourceName: "projects/rational-medley-466807-b3/secrets/TENANT_SERVICE_DATABASE_URL/versions/latest"
        fileName: "TENANT_SERVICE_DATABASE_URL"
  secretObjects:
    - secretName: tenant-service-secrets
      type: Opaque
      data:
        - objectName: JWT_SECRET_KEY
          key: JWT_SECRET_KEY
        - objectName: TENANT_SERVICE_DATABASE_URL
          key: TENANT_SERVICE_DATABASE_URL
---
