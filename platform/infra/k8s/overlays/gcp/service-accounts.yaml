# One KubernetesServiceAccount per backend service, each bound via
# Workload Identity to the matching GSA Terraform created
# (../../../terraform/gcp/workload_identity.tf's google_service_account.service).
# The `iam.gke.io/gcp-service-account` annotation is the actual binding on
# the k8s side — GCP's side of the same binding is the
# roles/iam.workloadIdentityUser grant in that same Terraform file,
# scoped to exactly `staffstream/<name>-ksa`, matching these names.
#
# rational-medley-466807-b3 gets replaced once by set-gcp-project.sh (see this
# directory's README.md) — every email below follows the fixed
# `<service>-sa@<project>.iam.gserviceaccount.com` naming
# workload_identity.tf also uses, so there's nothing else to keep in sync
# beyond the project id itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-service-ksa
  namespace: staffstream
  annotations:
    iam.gke.io/gcp-service-account: tenant-service-sa@rational-medley-466807-b3.iam.gserviceaccount.com
---
