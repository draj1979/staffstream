# GCP deployment overlay. Builds on ../../base (the local/kind base,
# referenced as one kustomization directory — Kustomize can only
# reference a base living outside an overlay's own directory tree, hence
# base/ and overlays/ as siblings) but:
#   - drops postgres.yaml's and postgres-vector.yaml's and redis.yaml's
#     resources via `$patch: delete` — Cloud SQL (two instances) and
#     Memorystore replace all three (see ../../../terraform/gcp)
#   - patches every Deployment to pull secrets via the Secret Manager CSI
#     driver instead of the shared staffstream-secrets Kubernetes Secret,
#     and to run a Cloud SQL Auth Proxy sidecar (the 9 DB-backed services)
#     instead of connecting to a Postgres IP directly
#   - adds a per-service KubernetesServiceAccount + SecretProviderClass
#     pair for each of the twelve services
#
# Argo CD builds this directly (spec.source.path: infra/k8s/overlays/gcp
# in ../../../terraform/gcp/argocd.tf's root Application) — no separate
# render step needed, AS LONG AS the three __GCP_*__ placeholder tokens
# below have already been replaced with real values. See
# set-gcp-project.sh and this directory's README.md.
resources:
- ../../base
- service-accounts.yaml
- secret-provider-classes.yaml

  # REDIS_URL moves from the plain ConfigMap to api-gateway's own
  # SecretProviderClass-synced secret — Memorystore has AUTH enabled
  # (redis.tf), unlike the in-cluster Redis this ConfigMap value was
  # written for, so it can no longer live in plaintext config.

  # Drop the in-cluster Postgres (both instances) and Redis entirely —
  # Cloud SQL and Memorystore replace them. `$patch: delete` removes a
  # whole resource pulled in from the base, rather than trying to
  # "un-include" individual files from a kustomization directory (not
  # something Kustomize supports once a base is referenced as a whole).

  # The 12 per-Deployment patches described at the top of this file — one
  # file, no explicit `target:` needed since each document inside already
  # carries its own kind/name for Kustomize to match against.

  # rabbitmq stays in-cluster (see the top comment) but still needs the
  # same Balanced compute-class nodeSelector as every service Deployment
  # in deployment-patches.yaml — Autopilot's default general-purpose
  # class (E2) has zero quota in this project's deploy region. Kept as
  # its own patch rather than folded into deployment-patches.yaml since
  # rabbitmq isn't a StaffStream service Deployment in the same sense
  # (no KSA/CSI/proxy patches apply to it).
patches:
- patch: |-
    - op: remove
      path: /data/REDIS_URL
  target:
    kind: ConfigMap
    name: staffstream-config
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: postgres-initdb
      namespace: staffstream
    $patch: delete
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: postgres-data
      namespace: staffstream
    $patch: delete
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgres
      namespace: staffstream
    $patch: delete
- patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: postgres
      namespace: staffstream
    $patch: delete
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: postgres-vector-data
      namespace: staffstream
    $patch: delete
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgres-vector
      namespace: staffstream
    $patch: delete
- patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: postgres-vector
      namespace: staffstream
    $patch: delete
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redis
      namespace: staffstream
    $patch: delete
- patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: redis
      namespace: staffstream
    $patch: delete
- path: deployment-patches.yaml
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: rabbitmq
      namespace: staffstream
    spec:
      template:
        spec:
          nodeSelector:
            cloud.google.com/compute-class: n2-only

# Rewrites each service's image from the base's local
# `staffstream/<service>:latest` to its real Artifact Registry path —
# this is also the one field the GitHub Actions deploy workflow
# (../../../.github/workflows/deploy-gcp.yml) actually edits after a
# build: `kustomize edit set image <name>=<newName>:<sha>` bumps newTag
# below and commits it, which is what Argo CD's automated sync then picks
# up. Nothing else in this overlay changes per-deploy — this is
# deliberately the one file/field CI touches.
images:
- name: staffstream/agent-registry
  newName: asia-south1-docker.pkg.dev/rational-medley-466807-b3/staffstream/agent-registry
  newTag: d20555dbc4e7ce8262f26668789554e1a1d03477
- name: staffstream/analytics-service
