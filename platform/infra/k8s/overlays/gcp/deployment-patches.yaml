# Strategic-merge patches, one per Deployment — each adds:
#   - serviceAccountName: <service>-ksa (Workload Identity — see
#     service-accounts.yaml + ../../../terraform/gcp/workload_identity.tf)
#   - a CSI volume + volume mount wired to that service's own
#     SecretProviderClass (secret-provider-classes.yaml); the mount is what
#     triggers the Secret Manager -> Kubernetes Secret sync, nothing in the
#     app reads /mnt/secrets-store directly
#   - envFrom.secretRef swapped from the shared staffstream-secrets to this
#     service's own synced <service>-secrets (same env var names, so no
#     application code changes)
#   - for the 9 DB-backed services: a cloud-sql-proxy sidecar container,
#     authenticating via the same Workload Identity binding (needs
#     roles/cloudsql.client, granted in workload_identity.tf) — no
#     password on this hop, the DATABASE_URL secret's password is for the
#     proxy-to-Postgres hop behind it
#
# What's UNCHANGED and therefore not repeated here: image, ports, probes,
# resources, the configMapRef half of envFrom — strategic merge only
# needs the fields actually changing; kustomize composes this on top of
# ../../services/<name>.yaml's base Deployment untouched.
#
# __GCP_PROJECT_ID__ / __GCP_REGION__ / __GCP_ENVIRONMENT__ get replaced
# once by set-gcp-project.sh — see this directory's README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: staffstream
spec:
  template:
    spec:
      serviceAccountName: tenant-service-ksa
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tenant-service-secrets
      containers:
        - name: tenant-service
          envFrom:
            - configMapRef: {name: staffstream-config}
            - secretRef: {name: tenant-service-secrets}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "__GCP_PROJECT_ID__:__GCP_REGION__:staffstream-main-__GCP_ENVIRONMENT__"
          securityContext:
            runAsNonRoot: true
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "128Mi"}
