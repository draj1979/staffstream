# Template only — copy to secret.yaml (already gitignored) and fill in
# real values before applying, or generate it imperatively instead:
#   kubectl create secret generic staffstream-secrets -n staffstream \
#     --from-literal=JWT_SECRET_KEY=... --from-literal=ANTHROPIC_API_KEY=... [...]
# Real deployments should pull these from Vault / GCP Secret Manager / AWS
# Secrets Manager (e.g. via External Secrets Operator) rather than a
# hand-filled YAML file at all — see CLAUDE.md's security baseline.
apiVersion: v1
kind: Secret
metadata:
  name: staffstream-secrets
  namespace: staffstream
type: Opaque
stringData:
  # Shared across every service that mints or verifies JWTs — MUST be
  # identical everywhere.
  JWT_SECRET_KEY: "REPLACE_ME_with_a_long_random_value"

  ANTHROPIC_API_KEY: "REPLACE_ME"
  VOYAGE_API_KEY: "REPLACE_ME"

  # LLM Gateway, Phase 10: only needed to actually call that provider —
  # the service starts fine without them, calls just fail with a normal
  # auth error from the provider until set.
  OPENAI_API_KEY: "REPLACE_ME"
  GEMINI_API_KEY: "REPLACE_ME"
  MISTRAL_API_KEY: "REPLACE_ME"
  DEEPSEEK_API_KEY: "REPLACE_ME"
  LLAMA_API_KEY: "REPLACE_ME" # Groq by default — see LLAMA_BASE_URL in .env.example

  # Skill Marketplace: Fernet key encrypting OAuth tokens at rest, and each
  # connector's OAuth app credentials. Generate the encryption key with
  # `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`.
  OAUTH_ENCRYPTION_KEY: "REPLACE_ME_with_a_generated_fernet_key"
  SLACK_CLIENT_ID: "REPLACE_ME"
  SLACK_CLIENT_SECRET: "REPLACE_ME"
  GOOGLE_CLIENT_ID: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  # Phase 10 connectors — same story: the service starts fine without
  # these, an OAuth authorize/exchange just fails until they're set.
  SALESFORCE_CLIENT_ID: "REPLACE_ME"
  SALESFORCE_CLIENT_SECRET: "REPLACE_ME"
  HUBSPOT_CLIENT_ID: "REPLACE_ME"
  HUBSPOT_CLIENT_SECRET: "REPLACE_ME"
  JIRA_CLIENT_ID: "REPLACE_ME"
  JIRA_CLIENT_SECRET: "REPLACE_ME"
  GITHUB_CLIENT_ID: "REPLACE_ME"
  GITHUB_CLIENT_SECRET: "REPLACE_ME"
  MICROSOFT_CLIENT_ID: "REPLACE_ME" # shared by Microsoft Teams + Microsoft 365
  MICROSOFT_CLIENT_SECRET: "REPLACE_ME"
  SERVICENOW_CLIENT_ID: "REPLACE_ME"
  SERVICENOW_CLIENT_SECRET: "REPLACE_ME"
  SAP_CLIENT_ID: "REPLACE_ME"
  SAP_CLIENT_SECRET: "REPLACE_ME"
  ORACLE_CLIENT_ID: "REPLACE_ME"
  ORACLE_CLIENT_SECRET: "REPLACE_ME"
  WHATSAPP_CLIENT_ID: "REPLACE_ME"
  WHATSAPP_CLIENT_SECRET: "REPLACE_ME"

  # Auth Service SSO: Fernet key encrypting each tenant's own SSO client
  # secret at rest — generate with the same one-liner as
  # OAUTH_ENCRYPTION_KEY above. Per-tenant Google Workspace/Auth0 client
  # IDs and secrets are NOT here — each tenant sets their own via
  # PUT /auth/sso/config/{provider}, not a platform-wide credential.
  SSO_ENCRYPTION_KEY: "REPLACE_ME_with_a_generated_fernet_key"

  # Postgres's own credentials (used by the postgres/postgres-vector
  # Deployments) and the connection strings built from them. Both
  # Postgres instances use the same username/password in this walking
  # skeleton — split them if that's ever not true for you.
  POSTGRES_USER: "staffstream"
  POSTGRES_PASSWORD: "REPLACE_ME_with_a_real_password"

  TENANT_SERVICE_DATABASE_URL: "postgresql+asyncpg://staffstream:REPLACE_ME_with_a_real_password@postgres:5432/tenant_service"
  EMPLOYEE_SERVICE_DATABASE_URL: "postgresql+asyncpg://staffstream:REPLACE_ME_with_a_real_password@postgres:5432/employee_service"
  AUTH_SERVICE_DATABASE_URL: "postgresql+asyncpg://staffstream:REPLACE_ME_with_a_real_password@postgres:5432/auth_service"
  AGENT_REGISTRY_DATABASE_URL: "postgresql+asyncpg://staffstream:REPLACE_ME_with_a_real_password@postgres:5432/agent_registry"
  MEMORY_SERVICE_DATABASE_URL: "postgresql+asyncpg://staffstream:REPLACE_ME_with_a_real_password@postgres:5432/memory_service"
  KNOWLEDGE_SERVICE_DATABASE_URL: "postgresql+asyncpg://staffstream:REPLACE_ME_with_a_real_password@postgres-vector:5432/knowledge_service"
  ANALYTICS_SERVICE_DATABASE_URL: "postgresql+asyncpg://staffstream:REPLACE_ME_with_a_real_password@postgres:5432/analytics_service"
  SKILL_MARKETPLACE_DATABASE_URL: "postgresql+asyncpg://staffstream:REPLACE_ME_with_a_real_password@postgres:5432/skill_marketplace"
  AUDIT_SERVICE_DATABASE_URL: "postgresql+asyncpg://staffstream:REPLACE_ME_with_a_real_password@postgres:5432/audit_service"
