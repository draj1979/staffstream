[project]
name = "staffstream-platform"
version = "0.0.1"
description = "Multi-tenant enterprise AI agent platform (powered by OpenClaw) — monorepo root"
requires-python = ">=3.12"
dependencies = [
    "tenancy",
    "auth",
    "tenant-service",
    "employee-service",
    "auth-service",
    "agent-registry",
    "llm-gateway",
    "openclaw-runtime",
    "memory-service",
    "knowledge-service",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
tenancy = { workspace = true }
auth = { workspace = true }
tenant-service = { workspace = true }
employee-service = { workspace = true }
auth-service = { workspace = true }
agent-registry = { workspace = true }
llm-gateway = { workspace = true }
openclaw-runtime = { workspace = true }
memory-service = { workspace = true }
knowledge-service = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["libs", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()-as-default is the idiomatic pattern

[tool.pytest.ini_options]
testpaths = ["libs", "services", "tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "httpx>=0.27"]
