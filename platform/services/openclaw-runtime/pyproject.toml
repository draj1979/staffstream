[project]
name = "openclaw-runtime"
version = "0.1.0"
description = "Stateless agent execution: loads agent, memory, knowledge, and skills fresh on every request"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "auth",
    "events",
]

[tool.uv.sources]
auth = { workspace = true }
events = { workspace = true }

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_runtime"]
