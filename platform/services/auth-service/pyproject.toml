[project]
name = "auth-service"
version = "0.1.0"
description = "Login, registration, JWT issuance and revocation (SSO/OAuth/MFA deferred to Phase 9)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "cryptography>=43.0",
    "pyjwt[crypto]>=2.9",
    "tenancy",
    "auth",
    "events",
]

[tool.uv.sources]
tenancy = { workspace = true }
auth = { workspace = true }
events = { workspace = true }

[dependency-groups]
dev = ["aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]
