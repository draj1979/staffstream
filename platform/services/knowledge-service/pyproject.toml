[project]
name = "knowledge-service"
version = "0.1.0"
description = "Company / department / personal knowledge: PDF/DOCX upload, chunking, embedding, pgvector retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "voyageai>=0.3",
    "tenancy",
    "auth",
]

[tool.uv.sources]
tenancy = { workspace = true }
auth = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_service"]
