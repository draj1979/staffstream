[project]
name = "llm-gateway"
version = "0.1.0"
description = "Provider abstraction over LLMs — Claude only for now, extensible for Phase 10"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "auth",
    "events",
]

[tool.uv.sources]
auth = { workspace = true }
events = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
