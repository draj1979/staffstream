[project]
name = "employee-service"
version = "0.1.0"
description = "Employee CRUD, AD/Google Workspace sync"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "tenancy",
]

[tool.uv.sources]
tenancy = { workspace = true }

[dependency-groups]
dev = ["aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/employee_service"]
