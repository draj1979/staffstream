[project]
name = "api-gateway"
version = "0.1.0"
description = "Single front door: per-tenant rate limiting, request size limits, centralized error sanitization, reverse proxy to every backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "auth",
]

[tool.uv.sources]
auth = { workspace = true }

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
