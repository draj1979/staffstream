[project]
name = "events"
version = "0.1.0"
description = "Shared event schemas and RabbitMQ pub/sub for cross-service analytics ingestion"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "aio-pika>=9.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
