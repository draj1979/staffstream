[project]
name = "tenancy"
version = "0.1.0"
description = "Shared tenant-isolation ORM base and query middleware for all tenant-scoped services"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "fastapi>=0.115",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenancy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
