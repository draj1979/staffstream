[project]
name = "auth"
version = "0.1.0"
description = "Shared JWT issuance/verification and password hashing for all services"
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "tenancy",
]

[tool.uv.sources]
tenancy = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
