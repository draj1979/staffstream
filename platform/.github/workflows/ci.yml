name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: staffstream
          POSTGRES_PASSWORD: staffstream
          POSTGRES_DB: staffstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffstream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # Separate instance, same as docker-compose.yml's postgres-vector —
      # Knowledge Service is the only thing that needs pgvector.
      postgres-vector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: staffstream
          POSTGRES_PASSWORD: staffstream
          POSTGRES_DB: knowledge_service
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U staffstream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Create per-service databases
        run: |
          PGPASSWORD=staffstream psql -h localhost -U staffstream -d staffstream \
            -c "CREATE DATABASE tenant_service" \
            -c "CREATE DATABASE employee_service" \
            -c "CREATE DATABASE auth_service" \
            -c "CREATE DATABASE agent_registry" \
            -c "CREATE DATABASE memory_service"

      - name: Migrate tenant-service against real Postgres
        working-directory: services/tenant-service
        env:
          TENANT_SERVICE_DATABASE_URL: postgresql+asyncpg://staffstream:staffstream@localhost:5432/tenant_service
        run: uv run alembic upgrade head

      - name: Migrate employee-service against real Postgres
        working-directory: services/employee-service
        env:
          EMPLOYEE_SERVICE_DATABASE_URL: postgresql+asyncpg://staffstream:staffstream@localhost:5432/employee_service
        run: uv run alembic upgrade head

      - name: Migrate auth-service against real Postgres
        working-directory: services/auth-service
        env:
          AUTH_SERVICE_DATABASE_URL: postgresql+asyncpg://staffstream:staffstream@localhost:5432/auth_service
        run: uv run alembic upgrade head

      - name: Migrate agent-registry against real Postgres
        working-directory: services/agent-registry
        env:
          AGENT_REGISTRY_DATABASE_URL: postgresql+asyncpg://staffstream:staffstream@localhost:5432/agent_registry
        run: uv run alembic upgrade head

      - name: Migrate memory-service against real Postgres
        working-directory: services/memory-service
        env:
          MEMORY_SERVICE_DATABASE_URL: postgresql+asyncpg://staffstream:staffstream@localhost:5432/memory_service
        run: uv run alembic upgrade head

      - name: Migrate knowledge-service against real Postgres+pgvector
        working-directory: services/knowledge-service
        env:
          KNOWLEDGE_SERVICE_DATABASE_URL: postgresql+asyncpg://staffstream:staffstream@localhost:5434/knowledge_service
        run: uv run alembic upgrade head

      - name: Test knowledge-service against real Postgres+pgvector
        working-directory: services/knowledge-service
        env:
          KNOWLEDGE_SERVICE_DATABASE_URL: postgresql+asyncpg://staffstream:staffstream@localhost:5434/knowledge_service
        run: uv run pytest .
