<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="5 variants, 2 sizes" viewport="700x240" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn { display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:8px; font-family:var(--font-sans); font-size:14px; font-weight:500; border:1px solid transparent; cursor:pointer; line-height:1; white-space:nowrap; }
.btn-primary { background:#FF5722; color:#fff; }
.btn-primary:hover { background:#E14918; }
.btn-secondary { background:#fff; color:#303841; border-color:#CFD5DC; }
.btn-secondary:hover { background:#F2F4F6; }
.btn-ghost { background:transparent; color:#303841; }
.btn-ghost:hover { background:#F2F4F6; }
.btn-dark { background:#303841; color:#F5F5F5; }
.btn-dark:hover { background:#1C2128; }
.btn-danger { background:#fff; color:#C53D14; border-color:#FFD9C9; }
.btn-sm { padding:6px 12px; font-size:13px; border-radius:6px; }
</style>
</head><body>
<div class="label-row"><span>Buttons</span><span class="meta">5 variants · 2 sizes</span></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
  <button class="btn btn-primary">Cite this passage</button>
  <button class="btn btn-secondary">Open in workspace</button>
  <button class="btn btn-dark">Sign in</button>
  <button class="btn btn-ghost">Cancel</button>
  <button class="btn btn-danger">Remove citation</button>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <button class="btn btn-primary btn-sm">Run research</button>
  <button class="btn btn-secondary btn-sm">Export</button>
  <button class="btn btn-ghost btn-sm">+ Add source</button>
  <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg4);margin-left:auto">small · 6/12 padding</span>
</div>
<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--fg3);line-height:1.5">
  Hover: color shift only — no scale, no translate. Press darkens one step further. Focus uses the teal ring.
</div>
</body></html>
