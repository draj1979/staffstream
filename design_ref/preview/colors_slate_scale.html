<!doctype html>
<!-- @dsCard group="Colors" name="Slate scale" subtitle="Ink, text, borders, chrome" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="label-row"><span>Slate scale</span><span class="meta">--slate-50 → --slate-950</span></div>
<div class="row" style="gap:4px">
  <div class="swatch" style="background:#F2F4F6;color:#303841;flex:1;height:64px;border-color:#E7EAEE"><div class="hex">50</div></div>
  <div class="swatch" style="background:#E7EAEE;color:#303841;flex:1;height:64px"><div class="hex">100</div></div>
  <div class="swatch" style="background:#CFD5DC;color:#303841;flex:1;height:64px"><div class="hex">200</div></div>
  <div class="swatch" style="background:#A8B3BF;color:#303841;flex:1;height:64px"><div class="hex">300</div></div>
  <div class="swatch" style="background:#8090A0;color:#fff;flex:1;height:64px"><div class="hex">400</div></div>
  <div class="swatch" style="background:#5A6878;color:#fff;flex:1;height:64px"><div class="hex">500</div></div>
  <div class="swatch" style="background:#455160;color:#fff;flex:1;height:64px"><div class="hex">600</div></div>
  <div class="swatch" style="background:#303841;color:#fff;flex:1;height:64px"><div class="hex">700</div></div>
  <div class="swatch" style="background:#242A32;color:#fff;flex:1;height:64px"><div class="hex">800</div></div>
  <div class="swatch" style="background:#1C2128;color:#fff;flex:1;height:64px"><div class="hex">900</div></div>
  <div class="swatch" style="background:#14181D;color:#fff;flex:1;height:64px"><div class="hex">950</div></div>
</div>
<div style="margin-top:12px;font-size:13px;color:var(--fg3)">Used for text, borders, and product chrome. The base brand slate is <span style="font-family:var(--font-mono);color:var(--fg1)">--slate-700</span>.</div>
</body></html>
