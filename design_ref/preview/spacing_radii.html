<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="xs → 2xl + pill" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="label-row"><span>Corner radii</span><span class="meta">2 → 20px + pill</span></div>
<div style="display:flex;gap:14px;align-items:flex-end">
  <div style="text-align:center"><div style="width:80px;height:80px;background:#303841;border-radius:2px"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">xs · 2</div></div>
  <div style="text-align:center"><div style="width:80px;height:80px;background:#303841;border-radius:4px"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">sm · 4</div></div>
  <div style="text-align:center"><div style="width:80px;height:80px;background:#303841;border-radius:6px"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">md · 6</div></div>
  <div style="text-align:center"><div style="width:80px;height:80px;background:#303841;border-radius:10px"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">lg · 10</div></div>
  <div style="text-align:center"><div style="width:80px;height:80px;background:#303841;border-radius:14px"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">xl · 14</div></div>
  <div style="text-align:center"><div style="width:80px;height:80px;background:#303841;border-radius:20px"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">2xl · 20</div></div>
  <div style="text-align:center"><div style="width:80px;height:80px;background:#303841;border-radius:999px"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">pill</div></div>
</div>
</body></html>
