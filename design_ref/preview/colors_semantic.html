<!doctype html>
<!-- @dsCard group="Colors" name="Semantic status" subtitle="Success, warning, danger, info pairings" viewport="700x170" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="label-row"><span>Semantic status</span><span class="meta">background + foreground pairings</span></div>
<div class="row" style="gap:10px">
  <div style="flex:1;border-radius:8px;background:#E6F2EC;padding:14px 14px 16px;border:1px solid #C8E2D5">
    <div style="font-family:var(--font-mono);font-size:10px;color:#2F8F6F;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">Success</div>
    <div style="color:#1F6E55;font-weight:500;font-size:14px">Filing accepted</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:#2F8F6F;margin-top:8px">#2F8F6F</div>
  </div>
  <div style="flex:1;border-radius:8px;background:#FAF1DC;padding:14px;border:1px solid #ECDDB8">
    <div style="font-family:var(--font-mono);font-size:10px;color:#B07A1A;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">Warning</div>
    <div style="color:#8B5E13;font-weight:500;font-size:14px">Citation may be stale</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:#B07A1A;margin-top:8px">#B07A1A</div>
  </div>
  <div style="flex:1;border-radius:8px;background:#FFF1EB;padding:14px;border:1px solid #FFD9C9">
    <div style="font-family:var(--font-mono);font-size:10px;color:#E14918;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">Danger</div>
    <div style="color:#C53D14;font-weight:500;font-size:14px">Overruled — do not cite</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:#E14918;margin-top:8px">#E14918</div>
  </div>
  <div style="flex:1;border-radius:8px;background:#EEF5F5;padding:14px;border:1px solid #D8E7E8">
    <div style="font-family:var(--font-mono);font-size:10px;color:#4E8487;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">Info</div>
    <div style="color:#2B4849;font-weight:500;font-size:14px">Pulled from Westlaw</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:#4E8487;margin-top:8px">#4E8487</div>
  </div>
</div>
</body></html>
