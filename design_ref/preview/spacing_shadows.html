<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Resting, menu, modal, focus" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="label-row"><span>Elevation</span><span class="meta">restrained — inks, not blurs</span></div>
<div style="background:#F5F5F5;padding:30px;border-radius:8px;display:flex;gap:24px;align-items:flex-end">
  <div style="text-align:center;flex:1">
    <div style="width:90px;height:60px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 1px 0 rgba(20,24,29,0.04);border:1px solid #E7EAEE"></div>
    <div style="margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">xs</div>
  </div>
  <div style="text-align:center;flex:1">
    <div style="width:90px;height:60px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(20,24,29,0.06),0 1px 0 rgba(20,24,29,0.03)"></div>
    <div style="margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">sm — resting card</div>
  </div>
  <div style="text-align:center;flex:1">
    <div style="width:90px;height:60px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(20,24,29,0.06),0 1px 2px rgba(20,24,29,0.04)"></div>
    <div style="margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">md — menu</div>
  </div>
  <div style="text-align:center;flex:1">
    <div style="width:90px;height:60px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 12px 32px rgba(20,24,29,0.10),0 2px 6px rgba(20,24,29,0.04)"></div>
    <div style="margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">lg — modal</div>
  </div>
  <div style="text-align:center;flex:1">
    <div style="width:90px;height:60px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 0 0 3px rgba(118,171,174,0.35),inset 0 0 0 1px #76ABAE"></div>
    <div style="margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--fg3)">focus ring</div>
  </div>
</div>
</body></html>
