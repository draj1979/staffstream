<!doctype html>
<!-- @dsCard group="Colors" name="Surfaces & text" subtitle="Background hierarchy + fg1–fg4" viewport="700x280" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="label-row"><span>Surfaces &amp; text</span><span class="meta">background hierarchy + text colors</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
  <div style="border-radius:8px;overflow:hidden;border:1px solid var(--border)">
    <div style="background:#FBFBFA;padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--fg2)">bg-elevated</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg4)">#FFFFFF</span></div>
    <div style="background:#F5F5F5;padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--fg2)">bg (bone)</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg4)">#F5F5F5</span></div>
    <div style="background:#ECECEA;padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--fg2)">bg-sunken</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg4)">#ECECEA</span></div>
    <div style="background:#EEF5F5;padding:12px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--fg2)">bg-tint</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg4)">#EEF5F5</span></div>
  </div>
  <div style="border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#fff">
    <div style="padding:14px 14px 8px;font-size:18px;font-weight:600;color:#1C2128">Primary text — fg1</div>
    <div style="padding:0 14px 8px;font-size:14px;color:#303841">Body text — fg2</div>
    <div style="padding:0 14px 8px;font-size:13px;color:#5A6878">Secondary — fg3</div>
    <div style="padding:0 14px 14px;font-size:12px;color:#8090A0">Placeholder — fg4</div>
    <div style="background:#1C2128;padding:10px 14px;color:#ECEEF1;font-size:13px">Inverse — fg-on-dark</div>
  </div>
</div>
</body></html>
