<!doctype html>
<!-- @dsCard group="Components" name="Action menu" subtitle="Citation context menu" viewport="700x280" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
</head><body>
<div class="label-row"><span>Menu</span><span class="meta">action menu — citation context</span></div>
<div style="display:flex;gap:18px;align-items:flex-start">
  <div style="background:#fff;border:1px solid #E7EAEE;border-radius:10px;box-shadow:0 4px 12px rgba(20,24,29,0.06),0 1px 2px rgba(20,24,29,0.04);padding:6px;width:260px">
    <div style="padding:8px 10px;display:flex;align-items:center;gap:10px;border-radius:6px;font-size:13px;color:#1C2128;background:#F2F4F6">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H1l8-8 8 8h-8z" transform="rotate(45 12 12)"/></svg>
      Cite this passage
      <span style="margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg4)">⌘C</span>
    </div>
    <div style="padding:8px 10px;display:flex;align-items:center;gap:10px;border-radius:6px;font-size:13px;color:#303841">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save to matter
    </div>
    <div style="padding:8px 10px;display:flex;align-items:center;gap:10px;border-radius:6px;font-size:13px;color:#303841">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/></svg>
      Open source document
    </div>
    <div style="padding:8px 10px;display:flex;align-items:center;gap:10px;border-radius:6px;font-size:13px;color:#303841">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-6 0v4"/><rect x="2" y="9" width="20" height="13" rx="2"/></svg>
      Mark as confidential
    </div>
    <div style="height:1px;background:#E7EAEE;margin:4px 6px"></div>
    <div style="padding:8px 10px;display:flex;align-items:center;gap:10px;border-radius:6px;font-size:13px;color:#C53D14">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      Remove citation
    </div>
  </div>
  <div style="flex:1;font-size:12px;color:var(--fg3);line-height:1.6">
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg4);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Rules</div>
    Single hover state: <span style="background:#F2F4F6;padding:2px 6px;border-radius:3px;color:#303841">--slate-50</span> wash.<br>
    Destructive items use ember text — never a red background row.<br>
    Keyboard shortcuts right-aligned in mono.
  </div>
</div>
</body></html>
